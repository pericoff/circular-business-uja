<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circular Business Challenge · UJA</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f6f5;color:#173329}*{box-sizing:border-box}body{margin:0}header{background:#123e30;color:white;padding:21px max(22px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{margin:0;font-size:22px}header small{color:#c5ddd2}.wrap{max-width:1160px;margin:auto;padding:24px 18px 70px}.card{background:white;border:1px solid #dbe5df;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 9px #16342608}h2{font-size:21px;margin:0 0 14px}h3{font-size:16px;margin:0 0 12px}p{line-height:1.5}.muted,small{color:#617369}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px}.kpi{background:#eef5f0;padding:15px;border-radius:9px}.kpi b{display:block;font-size:25px;margin-top:5px}label{display:block;font-weight:600;font-size:13px;margin:13px 0 6px}input,select{width:100%;padding:11px;border:1px solid #b8c9c0;border-radius:8px;background:white;font-size:14px}button{border:0;border-radius:8px;background:#176c4d;color:white;padding:11px 16px;font-weight:650;cursor:pointer;margin:4px 6px 4px 0}button:hover{background:#0d553c}button.secondary{background:#e5eee8;color:#1d503c}button.danger{background:#a43131}button:disabled{opacity:.45;cursor:not-allowed}.pill{font-size:12px;border-radius:50px;padding:5px 10px;background:#e4f0e9;color:#155638;font-weight:700}.tabs{margin-bottom:16px}.tabs button.active{background:#174d3a}.tabs button{background:#dae6df;color:#25523f}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 8px;border-bottom:1px solid #e2e9e4;text-align:left}th{color:#456151}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.alert{border-left:4px solid #d29c26;background:#fff8e5;padding:13px;border-radius:6px}.success{border-left:4px solid #23875e;background:#e7f6ed;padding:12px;border-radius:6px}.bad{color:#ae2c2c}.good{color:#13774b}.hidden{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.two{grid-template-columns:1fr}.wrap{padding:14px 10px}header{padding:16px}table{font-size:12px}th,td{padding:8px 4px}}.footer{color:#6a7d72;text-align:center;font-size:12px;margin-top:35px}.tag{font-size:12px;color:#587468;margin:0 0 10px}.bar{height:8px;background:#dfeae4;border-radius:12px;overflow:hidden}.bar>div{height:100%;background:#229466}.flex{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
 .guide{border-left:4px solid #176c4d;background:#eef7f1;padding:17px;border-radius:8px;margin:16px 0}.guide h3{margin:0 0 8px}.guide ol,.guide ul{padding-left:22px;line-height:1.65}.guide li{margin:5px 0}.instruction{background:#f4f7fa;border:1px solid #d7e3e8;border-radius:10px;padding:15px;margin:14px 0}.instruction strong{color:#123e30}.step{display:inline-block;background:#176c4d;color:white;font-size:12px;border-radius:30px;padding:3px 9px;margin-right:6px}.hint{border:1px solid #d5e8da;border-radius:9px;background:#f8fcf9;padding:14px;line-height:1.6}.callout{background:#fff8e5;border-left:4px solid #d29c26;padding:12px;border-radius:6px;margin:13px 0}details{border:1px solid #dbe5df;border-radius:8px;padding:12px;margin:8px 0;background:white}summary{cursor:pointer}details summary{cursor:pointer;font-weight:700} .copytext{white-space:pre-wrap;line-height:1.65;background:#f5f8f6;border-radius:8px;padding:14px;border:1px solid #dfe8e1} </style></head><body><header><div><h1>♻ Circular Business Challenge <span style="color:#97d8b6">UJA</span></h1><small>Simulación empresarial · Materiales y construcción sostenible</small></div><span id="headstatus" class="pill">Prototipo local</span></header><main class="wrap"><div class="tabs" id="tabs"><button data-role="prof" class="active">Panel del profesor</button><button data-role="alumno">Portal del alumnado</button><button data-role="reglas">Guía e instrucciones</button></div><section id="view"></section><p class="footer">Versión 1.1 · Guía docente ampliada · Datos ficticios y resultados docentes, no predicciones comerciales. La partida se guarda en este navegador.</p></main><script>
'use strict';const KEY='cbc_uja_v1';const names=['CircularBuild','EcoMaterial','ReBuild','GreenTech'];const formats=new Intl.NumberFormat('es-ES',{maximumFractionDigits:0});const euro=n=>formats.format(Math.round(n))+' €';const fmt=n=>formats.format(n);const $=id=>document.getElementById(id);const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function defaults(){return {round:1,phase:'decisions',event:'normal',teams:names.map((name,i)=>({id:i+1,name,code:'UJA'+(i+1)+'26',cash:250000,capacity:12500,quality:50,eco:50,market:50,tech:50,last:null,history:[],decision:null,submitted:false})),log:[],results:[]}}let db;try{db=JSON.parse(localStorage.getItem(KEY))||defaults();if(!db.teams||db.teams.length!==4)db=defaults()}catch{db=defaults()}let role='prof',selected=1,auth=false;function save(){localStorage.setItem(KEY,JSON.stringify(db))}function moneyCell(n){return `<td class="num">${euro(n)}</td>`}function message(s,cls='success'){return `<div class="${cls}">${s}</div>`}
const fields=[['price','Precio de venta (€/unidad)',20,90,45],['production','Producción prevista (unidades)',0,25000,11500],['capacityInv','Inversión en capacidad (€)',0,100000,10000],['rdInv','Inversión en I+D y calidad (€)',0,100000,15000],['ecoInv','Inversión ambiental (€)',0,100000,15000],['marketingInv','Inversión comercial (€)',0,100000,10000],['recycled','Materia prima recuperada (%)',0,90,45]];
function normalDecision(){return Object.fromEntries(fields.map(x=>[x[0],x[4]]))}function investment(d){return d.capacityInv+d.rdInv+d.ecoInv+d.marketingInv}function valid(d,t){let v=fields.every(([k,,min,max])=>Number.isFinite(d[k])&&d[k]>=min&&d[k]<=max);let maxInvestment=Math.min(150000,Math.max(0,t.cash-15000));return v&&investment(d)<=maxInvestment}
function eventDef(){return {normal:{name:'Mercado estable',desc:'Demanda sectorial estable y costes base.'},raw:{name:'Crisis de materias primas',desc:'El coste de material virgen aumenta un 25 %. Usar materia prima recuperada amortigua la crisis.'},demand:{name:'Caída de la demanda',desc:'La demanda del mercado disminuye un 18 %.'},green:{name:'Compra pública verde',desc:'Los compradores dan más importancia al desempeño ambiental.'},quality:{name:'Control de calidad',desc:'La demanda favorece empresas con prestaciones y calidad verificables.'}}[db.event]}
function profile(t,d,evt){let invest=investment(d);const cashAfter=t.cash-invest;const capacity=t.capacity+Math.floor(d.capacityInv/6);const quality=clamp(t.quality+d.rdInv/2500,0,100);const eco=clamp(t.eco+d.ecoInv/2500,0,100);const marketing=clamp(t.market+d.marketingInv/2500,0,100);const tech=clamp(t.tech+d.rdInv/4000,0,100);const rawCost=evt==='raw'?1.25:1;let variable=18+(100-quality)*0.045+(d.recycled*0.09)+(100-tech)*0.015+7*(1-d.recycled/100)*rawCost;let unitCO2=clamp(40-0.24*d.recycled-0.12*(eco-50),8,40);return {t,d,invest,cashAfter,capacity,quality,eco,marketing,tech,variable,unitCO2};}
function compute(){let evt=db.event;const market=Math.round(50000*(evt==='demand'?.82:1));let players=db.teams.map(t=>profile(t,t.decision,evt));let attractiveness=players.map(x=>{const d=x.d;let score=Math.exp((45-d.price)/20)*(.6+x.quality/180+x.marketing/260+x.eco/(evt==='green'?130:350));if(evt==='quality')score*=.6+x.quality/110;return Math.max(.01,score)});let shares=attractiveness.map(a=>a/attractiveness.reduce((s,v)=>s+v,0));let remaining=market;let alloc=Array(4).fill(0);let eligible=[0,1,2,3];for(let iter=0;iter<8&&remaining>0&&eligible.length;iter++){let weight=eligible.reduce((s,i)=>s+attractiveness[i],0);let assigned=0;for(let i of eligible){let p=players[i],available=Math.max(0,Math.min(p.capacity,p.d.production)-alloc[i]);let demand=Math.floor(remaining*attractiveness[i]/weight);let add=Math.min(available,demand);alloc[i]+=add;assigned+=add}remaining-=assigned;eligible=eligible.filter(i=>alloc[i]<Math.min(players[i].capacity,players[i].d.production));if(assigned===0){if(eligible.length){let i=eligible[0];alloc[i]++;remaining--;eligible=eligible.filter(j=>alloc[j]<Math.min(players[j].capacity,players[j].d.production))}else break;}}let results=players.map((p,i)=>{let sales=alloc[i],revenue=sales*p.d.price,cost=sales*p.variable+28000,operating=revenue-cost,cash=p.cashAfter+operating;let margin=p.d.price-p.variable;let breakeven=margin>0?Math.ceil(28000/margin):null;let share=sales/market*100;let circular=clamp(.5*p.d.recycled+.5*p.eco,0,100);let emissions=sales*p.unitCO2;return {...p,sales,share,revenue,cost,operating,cash,circular,emissions,breakeven}});const maxi=(field)=>Math.max(1,...results.map(r=>Math.max(0,r[field])));results.forEach(r=>{r.score=+(100*(.25*clamp((r.operating+100000)/250000,0,1)+.15*clamp(r.share/35,0,1)+.25*r.circular/100+.15*r.quality/100+.10*clamp(r.cash/300000,0,1)+.10*clamp(r.operating>=0?0.85:0.25,0,1))).toFixed(1)});return {market,results};}
function execute(){if(db.phase!=='decisions')return alert('La ronda ya está resuelta.');if(!db.teams.every(t=>t.submitted))return alert('Faltan decisiones de uno o más equipos.');const sim=compute();sim.results.forEach(r=>{let t=db.teams[r.t.id-1];t.cash=r.cash;t.capacity=r.capacity;t.quality=r.quality;t.eco=r.eco;t.market=r.marketing;t.tech=r.tech;t.last={sales:r.sales,share:r.share,operating:r.operating,cash:r.cash,circular:r.circular,quality:r.quality,emissions:r.emissions,score:r.score,unitCO2:r.unitCO2,price:r.d.price,breakeven:r.breakeven};t.history.push({...t.last,round:db.round});});db.results.push({round:db.round,event:db.event,market:sim.market,rows:sim.results.map(r=>({id:r.t.id,name:r.t.name,...db.teams[r.t.id-1].last}))});db.phase='results';db.log.push(`Ronda ${db.round}: ${eventDef().name}. Mercado ${fmt(sim.market)} unidades.`);save();render()}
function nextRound(){if(db.phase!=='results'||db.round>=4)return;db.round++;db.phase='decisions';db.event='normal';db.teams.forEach(t=>{t.decision=null;t.submitted=false});save();render()}
const roundInstructions={
1:{title:'Diseñar la empresa y entrar en el mercado',speech:'Vuestra empresa acaba de nacer. Disponéis de 250.000 € de tesorería y debéis competir por un mercado común de materiales de construcción. Hoy estableceréis vuestro precio, volumen de producción, inversiones y porcentaje de materias primas recuperadas. No se trata de maximizar un único indicador: hay que encontrar un equilibrio entre rentabilidad, calidad y circularidad. Antes de enviar, explicad qué cliente queréis atraer y por qué vuestra propuesta es competitiva.',mission:'Construir una estrategia inicial coherente y conservar liquidez.',question:'¿Qué hace diferente a vuestro producto y por qué el cliente pagaría vuestro precio?',prof:'Explica el mercado compartido, los 250.000 € iniciales y los límites de inversión. Pide una justificación breve de precio, producción y prioridades de inversión.'},
2:{title:'Competir, aprender y corregir',speech:'El mercado ha respondido a vuestras primeras decisiones. Revisad ventas, cuota de mercado, resultado y tesorería. Podéis mantener la estrategia o modificarla: invertir en calidad, mejorar el desempeño ambiental, ampliar capacidad o ajustar el precio. Las cuatro empresas compiten por la misma demanda. Una decisión eficaz para una empresa puede reducir las ventas de otra. Debéis justificar cada cambio con los resultados de la primera ronda.',mission:'Interpretar los resultados y ajustar decisiones sin comprometer la viabilidad.',question:'¿Qué indicador de la primera ronda os obliga a cambiar y qué esperáis conseguir?',prof:'Proyecta la clasificación anterior y pide identificar una fortaleza y un problema por empresa. Mantén mercado estable o introduce un evento si lo justificas.'},
3:{title:'Responder a un cambio del entorno',speech:'Vuestra empresa se enfrenta ahora a un escenario de incertidumbre. El profesor anunciará un evento de mercado: subida de materias primas, caída de la demanda, compra pública verde o mayor exigencia de calidad. Comprobad cómo afecta a vuestro modelo de negocio y adaptad el precio, la producción, las inversiones y el porcentaje de material recuperado. Debéis decidir qué riesgo asumir y qué recurso proteger.',mission:'Adaptarse al evento seleccionado sin sacrificar innecesariamente tesorería, calidad ni circularidad.',question:'¿Cuál es vuestro principal riesgo ante este evento y qué decisión lo reduce?',prof:'Selecciona y anuncia un evento antes de que los equipos entreguen sus decisiones. Aclara que el evento afecta a todas las empresas de esta ronda.'},
4:{title:'Consolidar la empresa y defender su futuro',speech:'Llegáis a la última ronda. Ya conocéis vuestra posición en el mercado y los efectos de las decisiones anteriores. Ahora debéis buscar un resultado final equilibrado: rentabilidad, cuota, calidad, circularidad y tesorería. Elegid con cuidado dónde invertir y qué capacidad podéis utilizar realmente. Al finalizar, defenderéis vuestro modelo de negocio, explicaréis las decisiones tomadas y señalaréis qué mejoraríais en un ejercicio futuro.',mission:'Consolidar resultados y preparar una defensa basada en datos.',question:'¿Por qué vuestra empresa merece continuar operando y qué habéis aprendido?',prof:'Tras ejecutar la ronda, muestra la clasificación y pide un balance de resultados, decisiones acertadas, errores y aprendizaje.'}
};
function roundGuide(who){const x=roundInstructions[db.round];return `<div class="guide"><span class="step">RONDA ${db.round} DE 4</span><h3 style="margin-top:10px">${x.title}</h3><p>${x.speech}</p><p><strong>Objetivo:</strong> ${x.mission}</p><p><strong>Pregunta para debatir:</strong> ${x.question}</p>${who==='prof'?`<div class="hint"><strong>Orientación para el profesor:</strong> ${x.prof}</div>`:''}</div>`}
function helpCard(){return `<div class="card"><h3>¿Cómo se juega? · Guía rápida</h3><div class="grid"><div class="instruction"><span class="step">1</span><strong>Profesor</strong><p>Selecciona el evento de la ronda y comparte con cada equipo su código. No pulses «Calcular» hasta que los cuatro hayan entregado.</p></div><div class="instruction"><span class="step">2</span><strong>Equipos</strong><p>En «Portal del alumnado», introducen su código, fijan las siete decisiones y pulsan «Enviar decisiones».</p></div><div class="instruction"><span class="step">3</span><strong>Simulador</strong><p>El profesor calcula resultados; se muestran ventas, beneficios simplificados, circularidad y clasificación.</p></div><div class="instruction"><span class="step">4</span><strong>Debate</strong><p>Los equipos comparan resultados, argumentan su estrategia y avanzan a la siguiente ronda. Se repite cuatro veces.</p></div></div><div class="callout"><strong>Antes de empezar:</strong> esta versión funciona únicamente en el navegador donde se abre; no sincroniza ordenadores distintos. En clase, usa un único equipo para recoger las decisiones de los grupos, cambiando entre códigos. El panel del profesor no está protegido con contraseña.</div></div>`}
function fieldHelp(){return `<div class="hint"><h3>Qué significa cada decisión</h3><ul><li><strong>Precio (20–90 €/unidad):</strong> un precio bajo puede atraer demanda, pero reduce el margen por venta.</li><li><strong>Producción prevista (0–25.000 unidades):</strong> es el máximo que quieres vender; las ventas reales también dependen de la capacidad y de los clientes que atraigas.</li><li><strong>Inversión en capacidad:</strong> aumenta la capacidad de fabricación para esta y las siguientes rondas.</li><li><strong>I+D y calidad:</strong> mejora las prestaciones y la eficiencia técnica según las reglas del juego.</li><li><strong>Inversión ambiental:</strong> mejora el indicador ambiental y reduce las emisiones modelizadas.</li><li><strong>Marketing:</strong> mejora el atractivo comercial y puede aumentar la demanda captada.</li><li><strong>Materia recuperada (0–90 %):</strong> favorece el indicador de circularidad, aunque puede incrementar el coste de preparación y control.</li></ul><p><strong>Regla presupuestaria:</strong> suma máxima de inversiones de 150.000 € por ronda y siempre deben quedar 15.000 € de tesorería antes del resultado comercial. Una inversión no es automáticamente un beneficio.</p></div>`}
function prof(){let submitted=db.teams.filter(t=>t.submitted).length;let html=`<div class="flex"><h2>Panel del profesor</h2><span class="pill">Ronda ${db.round}/4 · ${db.phase==='decisions'?'Recepción de decisiones':'Resultados publicados'}</span></div><div class="grid"><div class="kpi">Equipos<b>4</b></div><div class="kpi">Decisiones entregadas<b>${submitted}/4</b></div><div class="kpi">Capital inicial por equipo<b>250.000 €</b></div><div class="kpi">Demanda de referencia<b>50.000 ud.</b></div></div>${roundGuide('prof')}${helpCard()}<div class="card"><h3>Gestión de la ronda</h3><label for="event">Evento de mercado</label><select id="event" ${db.phase==='results'?'disabled':''}>${Object.entries({normal:'Mercado estable',raw:'Crisis de materias primas',demand:'Caída de demanda',green:'Compra pública verde',quality:'Control de calidad'}).map(([k,v])=>`<option value="${k}" ${db.event===k?'selected':''}>${v}</option>`).join('')}</select><p class="muted" id="eventdesc">${esc(eventDef().desc)}</p><button id="execute" ${submitted<4||db.phase==='results'?'disabled':''}>Calcular y publicar resultados</button>${db.phase==='results'&&db.round<4?'<button id="next">Abrir siguiente ronda</button>':''}${db.round===4&&db.phase==='results'?message('Simulación finalizada. Puede exportar los resultados.'):''}<button class="secondary" id="export">Exportar resultados CSV</button><button class="danger" id="reset">Reiniciar partida</button></div><div class="card"><h3>Empresas y accesos</h3><table><thead><tr><th>Empresa</th><th>Código del equipo</th><th>Estado</th><th class="num">Tesorería</th></tr></thead><tbody>${db.teams.map(t=>`<tr><td>${esc(t.name)}</td><td><code>${esc(t.code)}</code></td><td>${t.submitted?'Entregado':'Pendiente'}</td>${moneyCell(t.cash)}</tr>`).join('')}</tbody></table><p class="muted">Los códigos son demostrativos, no contraseñas seguras. Esta versión es local: los alumnos pueden probar distintos equipos en el mismo navegador, pero no conectarse simultáneamente desde dispositivos distintos.</p></div>`;if(db.results.length){let latest=db.results.at(-1);html+=`<div class="card"><h3>Clasificación · Ronda ${latest.round}</h3>${rank(latest.rows)}</div><div class="card"><h3>Detalle financiero y ambiental</h3><div style="overflow-x:auto"><table><thead><tr><th>Empresa</th><th class="num">Ventas (ud.)</th><th class="num">Cuota</th><th class="num">Resultado</th><th class="num">Tesorería</th><th class="num">Circularidad</th><th class="num">Emisiones (kg CO₂e)</th></tr></thead><tbody>${latest.rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="num">${fmt(r.sales)}</td><td class="num">${r.share.toFixed(1)} %</td>${moneyCell(r.operating)}${moneyCell(r.cash)}<td class="num">${r.circular.toFixed(1)}/100</td><td class="num">${fmt(r.emissions)}</td></tr>`).join('')}</tbody></table></div></div>`}return html}
function rank(rows){let sorted=[...rows].sort((a,b)=>b.score-a.score);return `<table><thead><tr><th>Posición</th><th>Empresa</th><th class="num">Puntuación</th><th class="num">Resultado</th></tr></thead><tbody>${sorted.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td class="num"><b>${r.score.toFixed(1)}/100</b></td>${moneyCell(r.operating)}</tr>`).join('')}</tbody></table>`}
function student(){if(!auth)return `<div class="card"><h2>Portal del alumnado</h2><p>El profesor os facilitará un código. Introducidlo aquí y enviad las siete decisiones de vuestra empresa para la ronda actual. Después podréis consultar vuestros resultados.</p><div class="callout"><strong>Modo demostración:</strong> profesor y equipos deben utilizar el mismo navegador. GitHub Pages no conecta las decisiones de distintos ordenadores.</div><label>Código de equipo</label><input id="teamcode" placeholder="Ejemplo: UJA126" autocomplete="off"><button id="login">Entrar en el equipo</button><p class="muted">Para demostración, el profesor puede consultar los cuatro códigos en su panel.</p></div>`;let t=db.teams[selected-1];let html=`<div class="flex"><h2>${esc(t.name)}</h2><button class="secondary" id="logout">Cambiar de equipo</button></div><div class="grid"><div class="kpi">Tesorería<b>${euro(t.cash)}</b></div><div class="kpi">Capacidad anual<b>${fmt(t.capacity)} ud.</b></div><div class="kpi">Calidad<b>${t.quality.toFixed(0)}/100</b></div><div class="kpi">Desempeño ambiental<b>${t.eco.toFixed(0)}/100</b></div></div>`;if(db.phase==='results'){html+=`<div class="card"><h3>Ronda ${db.round} resuelta</h3><p>${t.last?`Unidades vendidas: <b>${fmt(t.last.sales)}</b> · Resultado operativo: <b>${euro(t.last.operating)}</b> · Cuota de mercado: <b>${t.last.share.toFixed(1)} %</b>.`:'No hay resultados.'}</p><p class="muted">Las decisiones de la siguiente ronda se abrirán cuando el profesor continúe.</p></div>`;return html}html+=`${roundGuide('alumno')}<div class="card"><h3>Ronda ${db.round}: toma de decisiones</h3><div class="alert"><b>Evento:</b> ${esc(eventDef().name)}. ${esc(eventDef().desc)}</div><p class="muted">Las inversiones se descuentan de la tesorería. Debe conservarse un colchón mínimo de 15.000 €; el máximo de inversión por ronda es 150.000 €.</p>${fieldHelp()}${t.submitted?message('Decisiones entregadas. Puedes revisarlas, pero ya no modificarlas hasta la próxima ronda.'):`<form id="decisions"><div class="two">${fields.map(([k,label,min,max,def])=>`<div><label for="f_${k}">${label}</label><input id="f_${k}" name="${k}" type="number" step="1" min="${min}" max="${max}" value="${t.decision?.[k]??def}" required></div>`).join('')}</div><p id="investPreview" class="muted"></p><button type="submit">Enviar decisiones del equipo</button></form>`}</div>`;if(t.history.length){html+=`<div class="card"><h3>Historial del equipo</h3><table><thead><tr><th>Ronda</th><th class="num">Ventas</th><th class="num">Resultado</th><th class="num">Puntos</th></tr></thead><tbody>${t.history.map(h=>`<tr><td>${h.round}</td><td class="num">${fmt(h.sales)}</td>${moneyCell(h.operating)}<td class="num">${h.score.toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`}return html}
function rules(){return `<div class="card"><h2>Guía completa de la simulación</h2><p><strong>Objetivo:</strong> gestionar una empresa de materiales de construcción sostenible durante cuatro rondas. Las cuatro empresas compiten por el mismo mercado. Debéis demostrar que vuestro modelo puede equilibrar ventas, rentabilidad, tesorería, prestaciones y circularidad.</p><div class="grid"><div class="kpi">Empresas<b>4</b></div><div class="kpi">Rondas<b>4</b></div><div class="kpi">Tesorería inicial por empresa<b>250.000 €</b></div><div class="kpi">Mercado de referencia<b>50.000 ud.</b></div></div><h3 style="margin-top:22px">Instrucciones para el alumnado</h3><ol><li>Escuchad la explicación del profesor y revisad el evento de mercado de la ronda.</li><li>Entrad en «Portal del alumnado» con el código asignado a vuestra empresa.</li><li>Antes de decidir, revisad la tesorería, capacidad, resultados anteriores y objetivo de la ronda.</li><li>Introducid el precio, la producción prevista, las cuatro inversiones y el porcentaje recuperado. Comprobad que la suma de inversiones cumple el límite.</li><li>Justificad en una o dos frases por qué elegís esos valores. Guardad esa justificación en vuestro cuaderno de trabajo.</li><li>Pulsad «Enviar decisiones del equipo». Una vez entregadas, no podrán modificarse hasta la siguiente ronda.</li><li>Esperad a que el profesor publique los resultados. Analizad ventas, cuota, resultado, caja, circularidad y posición.</li></ol><h3>Instrucciones para el profesor</h3><ol><li>Explica la ronda y selecciona el evento antes de que los equipos envíen decisiones.</li><li>Distribuye los cuatro códigos desde el panel del profesor.</li><li>Recoge todas las decisiones en el <strong>mismo navegador</strong>. No hay sincronización entre ordenadores.</li><li>Comprueba que aparecen cuatro entregas de cuatro. Pulsa «Calcular y publicar resultados».</li><li>Proyecta la clasificación, comenta los indicadores y pide justificar los resultados.</li><li>Pulsa «Abrir siguiente ronda» y repite el proceso. Tras la cuarta, exporta el CSV.</li></ol><div class="callout"><strong>Importante:</strong> el panel del profesor, los códigos y los datos se guardan en este navegador mediante almacenamiento local. No se trata de un sistema de autenticación seguro ni de una aplicación multiusuario. Evita reiniciar o borrar datos del navegador antes de exportar resultados.</div></div><div class="card"><h2>Guion para introducir cada ronda</h2>${[1,2,3,4].map(i=>{let x=roundInstructions[i];return `<details ${i===db.round?'open':''}><summary>Ronda ${i} · ${x.title}</summary><div class="copytext">${x.speech}</div><p><strong>Objetivo:</strong> ${x.mission}</p><p><strong>Pregunta final:</strong> ${x.question}</p></details>`}).join('')}</div><div class="card"><h2>Decisiones, cálculo y evaluación</h2>${fieldHelp()}<h3>Cómo se calculan los resultados</h3><p>El motor reparte una demanda de referencia de 50.000 unidades según el atractivo relativo de cada empresa: precio, calidad, marketing y desempeño ambiental. Las ventas no pueden superar ni la capacidad ni la producción prevista. La demanda puede caer o cambiar según el evento de la ronda.</p><p><strong>Resultado operativo simplificado</strong> = ingresos por unidades vendidas − costes variables de esas unidades − 28.000 € de costes fijos por ronda. <strong>Tesorería final</strong> = tesorería anterior − inversiones + resultado operativo. El modelo no incluye impuestos, inventarios, préstamos, amortizaciones ni cobros aplazados.</p><h3>Indicadores del ranking</h3><table><tr><th>Indicador</th><th>Peso</th></tr><tr><td>Rentabilidad</td><td>25 %</td></tr><tr><td>Cuota de mercado</td><td>15 %</td></tr><tr><td>Circularidad</td><td>25 %</td></tr><tr><td>Calidad</td><td>15 %</td></tr><tr><td>Tesorería</td><td>10 %</td></tr><tr><td>Adaptación financiera (indicador simplificado)</td><td>10 %</td></tr></table><p><strong>Atención:</strong> el ranking de la aplicación se calcula para cada ronda. La evaluación académica global y la defensa oral pueden hacerse aparte. Los indicadores ambientales son ficticios y no sustituyen un análisis de ciclo de vida ni la validación normativa o técnica de los materiales.</p></div>`}
function csvExport(){let rows=[['Ronda','Evento','Empresa','Ventas','Cuota %','Resultado €','Tesorería €','Circularidad','Calidad','Emisiones kg CO2e','Puntuación']];for(let rr of db.results)for(let r of rr.rows)rows.push([rr.round,rr.event,r.name,r.sales,r.share.toFixed(2),r.operating.toFixed(2),r.cash.toFixed(2),r.circular.toFixed(2),r.quality.toFixed(2),r.emissions.toFixed(2),r.score.toFixed(1)]);let blob=new Blob(['\ufeff'+rows.map(r=>r.join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='circular_business_uja_resultados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.role===role));$('headstatus').textContent=`Ronda ${db.round} de 4`; $('view').innerHTML=role==='prof'?prof():role==='alumno'?student():rules();if(role==='prof'){if($('event'))$('event').onchange=e=>{db.event=e.target.value;save();render()};if($('execute'))$('execute').onclick=execute;if($('next'))$('next').onclick=nextRound;$('export').onclick=csvExport;$('reset').onclick=()=>{if(confirm('¿Reiniciar toda la simulación? Se perderán las decisiones y resultados guardados.')){db=defaults();auth=false;save();render()}}}if(role==='alumno'){if($('login'))$('login').onclick=()=>{let t=db.teams.find(t=>t.code.toLowerCase()===$('teamcode').value.trim().toLowerCase());if(!t)return alert('Código no válido');selected=t.id;auth=true;render()};if($('logout'))$('logout').onclick=()=>{auth=false;render()};if($('decisions')){$('decisions').oninput=()=>{let d=Object.fromEntries(fields.map(([k])=>[k,Number($('f_'+k).value)]));let t=db.teams[selected-1];let amount=investment(d);$('investPreview').innerHTML=`Inversión total: <b>${euro(amount)}</b>. Disponible máximo: ${euro(Math.min(150000,Math.max(0,t.cash-15000)))}.`};$('decisions').oninput();$('decisions').onsubmit=e=>{e.preventDefault();let t=db.teams[selected-1];let d=Object.fromEntries(fields.map(([k])=>[k,Number($('f_'+k).value)]));if(!valid(d,t))return alert('Revisa los rangos, el presupuesto de 150.000 € y la reserva mínima de tesorería.');t.decision=d;t.submitted=true;save();render()}}}}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{role=b.dataset.role;render()}));render();
</script></body></html>
