:root{--ink:#14382e;--forest:#123e30;--teal:#16815c;--cream:#f9f7ee}body{background:linear-gradient(180deg,#e8f2ed 0%,#f5f7f4 320px)}header{background:linear-gradient(115deg,#0b2b24,#175841);padding-top:27px;padding-bottom:27px}header h1{font-size:clamp(21px,3vw,28px);letter-spacing:-.6px}button{transition:transform .15s,background .15s,box-shadow .15s}button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 3px 12px #0b38232a}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a4d3b7;outline-offset:2px}.card{box-shadow:0 8px 25px #143e2910;border-color:#d8e5dd}h2{letter-spacing:-.35px}.hero{border:0;border-radius:20px;padding:28px 30px;margin-bottom:20px;color:white;background:radial-gradient(circle at 85% 15%,#318b69 0,#1b664b 24%,transparent 54%),linear-gradient(110deg,#0c3429,#174e3a);position:relative;overflow:hidden}.hero h2{font-size:clamp(26px,4vw,38px);max-width:730px;margin:7px 0 10px;line-height:1.12}.hero p{color:#e3f3e9;max-width:720px;margin:0 0 16px}.eyebrow{letter-spacing:2px;text-transform:uppercase;font-size:11px;font-weight:750;color:#a7dec0}.hero-stats{display:flex;gap:9px;flex-wrap:wrap}.hero-stats span{background:#ffffff22;color:white;border:1px solid #ffffff29;border-radius:30px;padding:7px 11px;font-size:12px}.step-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}.step-card{padding:15px;border:1px solid #d6e5dc;border-radius:12px;background:#f7faf8}.step-card strong{display:block;font-size:14px;margin:7px 0}.step-num{display:inline-grid;place-items:center;width:27px;height:27px;background:#dcefe3;color:#126343;border-radius:50%;font-weight:800}.lesson{background:linear-gradient(145deg,#f2f8f4,#fbfcf9);border:1px solid #cddfd4;border-radius:14px;padding:18px;margin:15px 0}.lesson h3{font-size:18px;margin:5px 0 9px}.lesson ul{padding-left:21px;line-height:1.6}.lesson p{margin:7px 0}.lesson .tag{color:#277152;font-weight:750;letter-spacing:1px;text-transform:uppercase}.roundbar{display:flex;gap:7px;margin:11px 0 18px}.roundbar span{flex:1;text-align:center;border-radius:8px;padding:9px 3px;font-size:11px;font-weight:750;background:#e6eee9;color:#537264}.roundbar span.done{background:#cce6d5;color:#1c6547}.roundbar span.current{background:#155f43;color:#fff}.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;margin-top:12px}.tip{background:white;border:1px solid #dce9df;border-radius:10px;padding:12px;font-size:13px}.tip b{display:block;margin-bottom:5px}.actionlist{background:#f5f9f5;border-radius:11px;padding:14px 17px;line-height:1.7}.actionlist ol{margin:6px 0;padding-left:20px}.details{border:1px solid #dbe7dd;border-radius:12px;padding:13px;margin:13px 0}.details summary{cursor:pointer;font-weight:750;color:#225c42}.video-card{background:#f0f6f1;border-left:4px solid #21895c;border-radius:8px;padding:12px 15px;margin-top:12px}.video-card a{color:#176847}.disclaimer{font-size:12px;color:#66766c}.fieldhelp{display:block;font-size:12px;color:#60766a;line-height:1.35;margin-top:4px}.quiz-note{border-left:4px solid #36a477;padding:12px 15px;background:#eff8f1;margin:11px 0}.topnav{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 18px}.topnav .tabs{margin:0}.footer{line-height:1.5}@media(max-width:650px){.hero{padding:22px 17px}.step-card{padding:12px}.roundbar span{font-size:10px}}
</style></head><body><header><div><h1>♻ Circular Business Challenge <span style="color:#97d8b6">UJA</span></h1><small>Simulación empresarial · Materiales y construcción sostenible</small></div><span id="headstatus" class="pill">Prototipo local</span></header><main class="wrap"><div class="topnav"><div class="tabs" id="tabs"><button data-role="prof" class="active">Panel del profesor</button><button data-role="alumno">Portal del alumnado</button><button data-role="reglas">Guía e instrucciones</button></div><span class="pill">Aprende · Decide · Compite</span></div><section id="view"></section><p class="footer">Versión 4.0 · Datos ficticios y resultados docentes, no predicciones comerciales. La partida se guarda en este navegador.</p></main><script>
'use strict';const KEY='cbc_uja_v1';const names=['CircularBuild','EcoMaterial','ReBuild','GreenTech'];const formats=new Intl.NumberFormat('es-ES',{maximumFractionDigits:0});const euro=n=>formats.format(Math.round(n))+' €';const fmt=n=>formats.format(n);const $=id=>document.getElementById(id);const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function defaults(){return {round:1,phase:'decisions',event:'normal',teams:names.map((name,i)=>({id:i+1,name,code:'UJA'+(i+1)+'26',cash:250000,capacity:12500,quality:50,eco:50,market:50,tech:50,last:null,history:[],decision:null,submitted:false})),log:[],results:[]}}let db;try{db=JSON.parse(localStorage.getItem(KEY))||defaults();if(!db.teams||db.teams.length!==4)db=defaults()}catch{db=defaults()}let role='prof',selected=1,auth=false;function save(){localStorage.setItem(KEY,JSON.stringify(db))}function moneyCell(n){return `<td class="num">${euro(n)}</td>`}function message(s,cls='success'){return `<div class="${cls}">${s}</div>`}
const fields=[['price','Precio de venta (€/unidad)',20,90,45],['production','Producción prevista (unidades)',0,25000,11500],['capacityInv','Inversión en capacidad (€)',0,100000,10000],['rdInv','Inversión en I+D y calidad (€)',0,100000,15000],['ecoInv','Inversión ambiental (€)',0,100000,15000],['marketingInv','Inversión comercial (€)',0,100000,10000],['recycled','Materia prima recuperada (%)',0,90,45]];
function normalDecision(){return Object.fromEntries(fields.map(x=>[x[0],x[4]]))}function investment(d){return d.capacityInv+d.rdInv+d.ecoInv+d.marketingInv}function valid(d,t){let v=fields.every(([k,,min,max])=>Number.isFinite(d[k])&&d[k]>=min&&d[k]<=max);let maxInvestment=Math.min(150000,Math.max(0,t.cash-15000));return v&&investment(d)<=maxInvestment}
function eventDef(){return {normal:{name:'Mercado estable',desc:'Demanda sectorial estable y costes base.'},raw:{name:'Crisis de materias primas',desc:'El coste de material virgen aumenta un 25 %. Usar materia prima recuperada amortigua la crisis.'},demand:{name:'Caída de la demanda',desc:'La demanda del mercado disminuye un 18 %.'},green:{name:'Compra pública verde',desc:'Los compradores dan más importancia al desempeño ambiental.'},quality:{name:'Control de calidad',desc:'La demanda favorece empresas con prestaciones y calidad verificables.'}}[db.event]}
function profile(t,d,evt){let invest=investment(d);const cashAfter=t.cash-invest;const capacity=t.capacity+Math.floor(d.capacityInv/6);const quality=clamp(t.quality+d.rdInv/2500,0,100);const eco=clamp(t.eco+d.ecoInv/2500,0,100);const marketing=clamp(t.market+d.marketingInv/2500,0,100);const tech=clamp(t.tech+d.rdInv/4000,0,100);const rawCost=evt==='raw'?1.25:1;let variable=18+(100-quality)*0.045+(d.recycled*0.09)+(100-tech)*0.015+7*(1-d.recycled/100)*rawCost;let unitCO2=clamp(40-0.24*d.recycled-0.12*(eco-50),8,40);return {t,d,invest,cashAfter,capacity,quality,eco,marketing,tech,variable,unitCO2};}
function compute(){let evt=db.event;const market=Math.round(50000*(evt==='demand'?.82:1));let players=db.teams.map(t=>profile(t,t.decision,evt));let attractiveness=players.map(x=>{const d=x.d;let score=Math.exp((45-d.price)/20)*(.6+x.quality/180+x.marketing/260+x.eco/(evt==='green'?130:350));if(evt==='quality')score*=.6+x.quality/110;return Math.max(.01,score)});let shares=attractiveness.map(a=>a/attractiveness.reduce((s,v)=>s+v,0));let remaining=market;let alloc=Array(4).fill(0);let eligible=[0,1,2,3];for(let iter=0;iter<8&&remaining>0&&eligible.length;iter++){let weight=eligible.reduce((s,i)=>s+attractiveness[i],0);let assigned=0;for(let i of eligible){let p=players[i],available=Math.max(0,Math.min(p.capacity,p.d.production)-alloc[i]);let demand=Math.floor(remaining*attractiveness[i]/weight);let add=Math.min(available,demand);alloc[i]+=add;assigned+=add}remaining-=assigned;eligible=eligible.filter(i=>alloc[i]<Math.min(players[i].capacity,players[i].d.production));if(assigned===0){if(eligible.length){let i=eligible[0];alloc[i]++;remaining--;eligible=eligible.filter(j=>alloc[j]<Math.min(players[j].capacity,players[j].d.production))}else break;}}let results=players.map((p,i)=>{let sales=alloc[i],revenue=sales*p.d.price,cost=sales*p.variable+28000,operating=revenue-cost,cash=p.cashAfter+operating;let margin=p.d.price-p.variable;let breakeven=margin>0?Math.ceil(28000/margin):null;let share=sales/market*100;let circular=clamp(.5*p.d.recycled+.5*p.eco,0,100);let emissions=sales*p.unitCO2;return {...p,sales,share,revenue,cost,operating,cash,circular,emissions,breakeven}});const maxi=(field)=>Math.max(1,...results.map(r=>Math.max(0,r[field])));results.forEach(r=>{r.score=+(100*(.25*clamp((r.operating+100000)/250000,0,1)+.15*clamp(r.share/35,0,1)+.25*r.circular/100+.15*r.quality/100+.10*clamp(r.cash/300000,0,1)+.10*clamp(r.operating>=0?0.85:0.25,0,1))).toFixed(1)});return {market,results};}
function execute(){if(db.phase!=='decisions')return alert('La ronda ya está resuelta.');if(!db.teams.every(t=>t.submitted))return alert('Faltan decisiones de uno o más equipos.');const sim=compute();sim.results.forEach(r=>{let t=db.teams[r.t.id-1];t.cash=r.cash;t.capacity=r.capacity;t.quality=r.quality;t.eco=r.eco;t.market=r.marketing;t.tech=r.tech;t.last={sales:r.sales,share:r.share,operating:r.operating,cash:r.cash,circular:r.circular,quality:r.quality,emissions:r.emissions,score:r.score,unitCO2:r.unitCO2,price:r.d.price,breakeven:r.breakeven};t.history.push({...t.last,round:db.round});});db.results.push({round:db.round,event:db.event,market:sim.market,rows:sim.results.map(r=>({id:r.t.id,name:r.t.name,...db.teams[r.t.id-1].last}))});db.phase='results';db.log.push(`Ronda ${db.round}: ${eventDef().name}. Mercado ${fmt(sim.market)} unidades.`);save();render()}
function nextRound(){if(db.phase!=='results'||db.round>=4)return;db.round++;db.phase='decisions';db.event='normal';db.teams.forEach(t=>{t.decision=null;t.submitted=false});save();render()}
const chapterData=[
{title:'La idea se convierte en empresa',subtitle:'Diseño del modelo de negocio',story:'Jaén quiere impulsar soluciones constructivas con menor impacto ambiental. Tu equipo dispone de 250.000 € y una oportunidad de mercado, pero también de rivales con el mismo objetivo. La primera decisión determinará qué tipo de empresa vas a construir.',objective:'Crear una propuesta viable y decidir el posicionamiento inicial.',tasks:['Elige precio y producción anual esperada.','Invierte en capacidad, innovación, circularidad y comercialización.','Asegura fondos suficientes para comenzar a operar.'],question:'¿Qué ventaja competitiva ofrecerá tu empresa y por qué te comprarían?',video:'Imagina que acabas de fundar una empresa en el sector de materiales de construcción sostenible. Tienes una oportunidad: transformar una nueva solución constructiva en un negocio real. Pero no estás solo. Otras tres empresas competirán por los mismos clientes, con recursos iniciales idénticos. Dispones de doscientos cincuenta mil euros y debes decidir qué vas a priorizar: capacidad de producción, investigación, sostenibilidad o comercialización. También fijarás tu primer precio de venta. Recuerda que no se trata únicamente de fabricar un material más ecológico. Tienes que demostrar que satisface una necesidad, que puede venderse y que tu empresa puede sostenerse económicamente. Tus decisiones de hoy serán el punto de partida de toda la competición. ¿Qué modelo de negocio vas a construir?'},
{title:'El mercado dicta sentencia',subtitle:'Competencia y captación de clientes',story:'La empresa ya está en marcha. Los compradores comparan precios, calidad y desempeño ambiental. La demanda es limitada: cada venta que consigue un rival puede ser una oportunidad menos para tu equipo.',objective:'Conseguir ventas sin destruir el margen de contribución.',tasks:['Revisa los resultados publicados de la primera ronda.','Ajusta precios y producción a la cuota real conseguida.','Decide en qué invertir para superar a los competidores.'],question:'¿Conviene vender más barato o diferenciarse con calidad y circularidad?',video:'Tu empresa ha iniciado su actividad y ahora llega la prueba decisiva: el mercado. Los clientes no compran una idea, compran una solución que les aporte valor. Compararán el precio, la calidad, la sostenibilidad y la capacidad de respuesta de las cuatro empresas. La demanda total es limitada, de modo que vuestras decisiones están conectadas: si una empresa gana cuota, otra puede perderla. Antes de decidir, estudia los resultados del ejercicio anterior. ¿Has vendido lo previsto? ¿Has conseguido un margen suficiente? ¿Te sobra capacidad productiva? En esta ronda tendrás que equilibrar ambición y prudencia. Bajar el precio puede atraer compradores, pero también reducir tus beneficios. Invertir en innovación puede reforzar tu posición, aunque consume tesorería. ¿Qué cambiarás para mejorar tu competitividad?'},
{title:'La crisis pone a prueba la estrategia',subtitle:'Gestión de riesgos e incertidumbre',story:'La estabilidad ha terminado. El profesor anuncia un acontecimiento inesperado: subida de materias primas, caída de la demanda, compra pública verde o mayores exigencias de calidad.',objective:'Adaptar la estrategia manteniendo la empresa solvente.',tasks:['Lee cuidadosamente el acontecimiento elegido por el profesor.','Identifica los costes y ventajas competitivas que cambian.','Modifica las decisiones y justifica tu respuesta al riesgo.'],question:'¿Qué sacrificarías hoy para proteger la supervivencia de la empresa?',video:'Las empresas no compiten en un entorno estable. Los precios de las materias primas cambian, los clientes modifican sus preferencias y pueden aparecer nuevas exigencias ambientales o técnicas. En esta tercera ronda, tu empresa afrontará una situación inesperada. El profesor anunciará un evento de mercado que alterará las condiciones de juego. Tendrás que reaccionar con la información disponible y con los recursos que hayas conservado. Una empresa muy rentable puede descubrir que depende demasiado de un insumo. Otra que invirtió en circularidad puede encontrar una ventaja frente a la crisis. Analiza el riesgo, revisa tus costes, protege tu liquidez y explica por qué tu nueva estrategia es la más adecuada. No siempre gana quien más crece: a veces gana quien mejor se adapta.'},
{title:'El momento de demostrar el valor',subtitle:'Consolidación y defensa ante inversores',story:'Llega el último ejercicio. Los resultados acumulados mostrarán si tu estrategia crea una empresa sólida o solo un buen resultado puntual. Es momento de decidir y defender el futuro del negocio.',objective:'Cerrar la competición con una propuesta rentable, sólida y circular.',tasks:['Analiza toda la trayectoria de tu empresa.','Realiza las últimas decisiones de precio e inversión.','Prepara una defensa breve con resultados económicos y ambientales.'],question:'¿Por qué debería financiarse tu empresa y no la de tus competidores?',video:'Has llegado a la ronda final del Circular Business Challenge. Tu empresa ya ha competido, ha tomado decisiones de inversión y se ha enfrentado a la incertidumbre. Ahora debes demostrar que tu modelo de negocio merece continuar. Analiza tus resultados acumulados: ventas, cuota de mercado, tesorería, calidad y circularidad. Decide si es el momento de consolidar, invertir o proteger los recursos disponibles. Recuerda que el mejor negocio no es necesariamente el que más factura, sino el que combina viabilidad económica, desempeño técnico y sostenibilidad. Tras esta última ronda tendrás que defender tu estrategia ante el profesor, que actuará como inversor. ¿Qué has aprendido de tus decisiones? ¿Qué harías de otra forma? Y, sobre todo, ¿por qué merece la pena apostar por tu empresa?'},
];
function roundbar(){return '<div class="roundbar">'+chapterData.map((r,i)=>`<span class="${i+1<db.round?'done':i+1===db.round?'current':''}">${i+1}. ${['Crear','Competir','Adaptar','Consolidar'][i]}</span>`).join('')+'</div>'}
function intro(){const r=chapterData[db.round-1];return `<section class="hero"><div class="eyebrow">Circular Business Challenge · Capítulo ${db.round} de 4</div><h2>${esc(r.title)}</h2><p>${esc(r.story)}</p><div class="hero-stats"><span>4 empresas</span><span>Un mercado común</span><span>250.000 € iniciales</span><span>Decisiones con consecuencias</span></div></section>${roundbar()}<section class="card"><span class="eyebrow" style="color:#246a4b">Briefing de la ronda</span><h2>${esc(r.subtitle)}</h2><p><b>Tu misión:</b> ${esc(r.objective)}</p><div class="step-cards">${r.tasks.map((t,i)=>`<div class="step-card"><span class="step-num">${i+1}</span><strong>${esc(t)}</strong></div>`).join('')}</div><div class="quiz-note"><b>Pregunta estratégica:</b> ${esc(r.question)}</div><details class="details"><summary>Guion para el vídeo de introducción (aprox. 1 minuto)</summary><p>${esc(r.video)}</p><button class="secondary copy-script" data-round="${db.round}">Copiar guion</button></details></section>`}
function siteHero(){return `<section class="hero"><div class="eyebrow">Universidad de Jaén · Máster en Ingeniería de los Materiales y Construcción Sostenible</div><h2>Construye una empresa. Compite. Aprende de tus decisiones.</h2><p>Gestiona una empresa ficticia de materiales constructivos circulares. Cuatro equipos, cuatro ejercicios, un mercado compartido y decisiones que alteran tus resultados.</p><div class="hero-stats"><span>4 rondas</span><span>4 equipos</span><span>7 decisiones por ronda</span><span>Ranking competitivo</span></div></section>`}
function welcome(){return `<div class="card"><h2>Antes de comenzar</h2><p>Tu objetivo no es solo obtener el máximo beneficio. Deberás justificar un modelo de negocio que combine rentabilidad, prestaciones técnicas y uso responsable de recursos.</p><div class="step-cards"><div class="step-card"><span class="step-num">1</span><strong>Explora tu empresa</strong><small>Consulta tu tesorería, capacidad e indicadores iniciales.</small></div><div class="step-card"><span class="step-num">2</span><strong>Diseña una estrategia</strong><small>Define precios, volumen e inversiones con un límite de presupuesto.</small></div><div class="step-card"><span class="step-num">3</span><strong>Envía tus decisiones</strong><small>El profesor calculará simultáneamente los resultados de los cuatro equipos.</small></div><div class="step-card"><span class="step-num">4</span><strong>Aprende y adapta</strong><small>Compara resultados y mejora tu modelo en la siguiente ronda.</small></div></div><p class="disclaimer">Versión de demostración: esta web guarda partidas en el navegador local, no sincroniza dispositivos diferentes.</p></div>`}
function helpNotes(){let tips={price:'Un precio bajo puede mejorar la cuota, pero reduce el margen por unidad.',production:'No podrás vender más de lo que decidas producir ni de tu capacidad instalada.',capacityInv:'Cada 6 € invertidos añaden una unidad de capacidad anual.',rdInv:'Refuerza calidad y tecnología; puede mejorar el coste variable.',ecoInv:'Incrementa el indicador ambiental y mejora las emisiones estimadas.',marketingInv:'Aumenta la visibilidad comercial en el reparto de demanda.',recycled:'Reduce emisiones estimadas y dependencia de materia virgen, pero puede incrementar el coste de procesado.'};return tips}
function prof(){let submitted=db.teams.filter(t=>t.submitted).length;let html=`<div class="flex"><h2>Panel del profesor</h2><span class="pill">Ronda ${db.round}/4 · ${db.phase==='decisions'?'Recepción de decisiones':'Resultados publicados'}</span></div><div class="grid"><div class="kpi">Equipos<b>4</b></div><div class="kpi">Decisiones entregadas<b>${submitted}/4</b></div><div class="kpi">Capital inicial por equipo<b>250.000 €</b></div><div class="kpi">Demanda de referencia<b>50.000 ud.</b></div></div><div class="card"><h3>Gestión de la ronda</h3><label for="event">Evento de mercado</label><select id="event" ${db.phase==='results'?'disabled':''}>${Object.entries({normal:'Mercado estable',raw:'Crisis de materias primas',demand:'Caída de demanda',green:'Compra pública verde',quality:'Control de calidad'}).map(([k,v])=>`<option value="${k}" ${db.event===k?'selected':''}>${v}</option>`).join('')}</select><p class="muted" id="eventdesc">${esc(eventDef().desc)}</p><button id="execute" ${submitted<4||db.phase==='results'?'disabled':''}>Calcular y publicar resultados</button>${db.phase==='results'&&db.round<4?'<button id="next">Abrir siguiente ronda</button>':''}${db.round===4&&db.phase==='results'?message('Simulación finalizada. Puede exportar los resultados.'):''}<button class="secondary" id="export">Exportar resultados CSV</button><button class="danger" id="reset">Reiniciar partida</button></div><div class="card"><h3>Empresas y accesos</h3><table><thead><tr><th>Empresa</th><th>Código del equipo</th><th>Estado</th><th class="num">Tesorería</th></tr></thead><tbody>${db.teams.map(t=>`<tr><td>${esc(t.name)}</td><td><code>${esc(t.code)}</code></td><td>${t.submitted?'Entregado':'Pendiente'}</td>${moneyCell(t.cash)}</tr>`).join('')}</tbody></table><p class="muted">Los códigos son demostrativos, no contraseñas seguras. Esta versión es local: los alumnos pueden probar distintos equipos en el mismo navegador, pero no conectarse simultáneamente desde dispositivos distintos.</p></div>`;if(db.results.length){let latest=db.results.at(-1);html+=`<div class="card"><h3>Clasificación · Ronda ${latest.round}</h3>${rank(latest.rows)}</div><div class="card"><h3>Detalle financiero y ambiental</h3><div style="overflow-x:auto"><table><thead><tr><th>Empresa</th><th class="num">Ventas (ud.)</th><th class="num">Cuota</th><th class="num">Resultado</th><th class="num">Tesorería</th><th class="num">Circularidad</th><th class="num">Emisiones (kg CO₂e)</th></tr></thead><tbody>${latest.rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="num">${fmt(r.sales)}</td><td class="num">${r.share.toFixed(1)} %</td>${moneyCell(r.operating)}${moneyCell(r.cash)}<td class="num">${r.circular.toFixed(1)}/100</td><td class="num">${fmt(r.emissions)}</td></tr>`).join('')}</tbody></table></div></div>`}return intro()+html}
function rank(rows){let sorted=[...rows].sort((a,b)=>b.score-a.score);return `<table><thead><tr><th>Posición</th><th>Empresa</th><th class="num">Puntuación</th><th class="num">Resultado</th></tr></thead><tbody>${sorted.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td class="num"><b>${r.score.toFixed(1)}/100</b></td>${moneyCell(r.operating)}</tr>`).join('')}</tbody></table>`}
function student(){if(!auth)return siteHero()+welcome()+`<div class="card"><h2>Portal del alumnado</h2><p>Introduce el código de uno de los cuatro equipos para probar sus decisiones. Los datos se guardan únicamente en este navegador.</p><label>Código de equipo</label><input id="teamcode" placeholder="Ejemplo: UJA126" autocomplete="off"><button id="login">Entrar en el equipo</button><p class="muted">Para demostración, el profesor puede consultar los cuatro códigos en su panel.</p></div>`;let t=db.teams[selected-1];let html=`<div class="flex"><h2>${esc(t.name)}</h2><button class="secondary" id="logout">Cambiar de equipo</button></div><div class="grid"><div class="kpi">Tesorería<b>${euro(t.cash)}</b></div><div class="kpi">Capacidad anual<b>${fmt(t.capacity)} ud.</b></div><div class="kpi">Calidad<b>${t.quality.toFixed(0)}/100</b></div><div class="kpi">Desempeño ambiental<b>${t.eco.toFixed(0)}/100</b></div></div>`;if(db.phase==='results'){html+=`<div class="card"><h3>Ronda ${db.round} resuelta</h3><p>${t.last?`Unidades vendidas: <b>${fmt(t.last.sales)}</b> · Resultado operativo: <b>${euro(t.last.operating)}</b> · Cuota de mercado: <b>${t.last.share.toFixed(1)} %</b>.`:'No hay resultados.'}</p><p class="muted">Las decisiones de la siguiente ronda se abrirán cuando el profesor continúe.</p></div>`;return intro()+html}html+=`<div class="card"><h3>Ronda ${db.round}: toma de decisiones</h3><div class="alert"><b>Evento:</b> ${esc(eventDef().name)}. ${esc(eventDef().desc)}</div><p class="muted">Las inversiones se descuentan de la tesorería. Debe conservarse un colchón mínimo de 15.000 €; el máximo de inversión por ronda es 150.000 €.</p>${t.submitted?message('Decisiones entregadas. Puedes revisarlas, pero ya no modificarlas hasta la próxima ronda.'):`<form id="decisions"><div class="two">${fields.map(([k,label,min,max,def])=>`<div><label for="f_${k}">${label}</label><input id="f_${k}" name="${k}" type="number" step="1" min="${min}" max="${max}" value="${t.decision?.[k]??def}" required><span class="fieldhelp">${esc(helpNotes()[k])}</span></div>`).join('')}</div><p id="investPreview" class="muted"></p><button type="submit">Enviar decisiones del equipo</button></form>`}</div>`;if(t.history.length){html+=`<div class="card"><h3>Historial del equipo</h3><table><thead><tr><th>Ronda</th><th class="num">Ventas</th><th class="num">Resultado</th><th class="num">Puntos</th></tr></thead><tbody>${t.history.map(h=>`<tr><td>${h.round}</td><td class="num">${fmt(h.sales)}</td>${moneyCell(h.operating)}<td class="num">${h.score.toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`}return intro()+html}
function rules(){return siteHero()+welcome()+`<div class="card"><h2>Reglas de simulación · Versión 1</h2><p>Cuatro empresas venden un <b>elemento constructivo de función equivalente</b> y compiten por 50.000 unidades anuales. Todas parten con 250.000 € en tesorería, capacidad de 12.500 unidades, y niveles iniciales de calidad, impacto ambiental, comercialización y tecnología de 50/100.</p><h3>Decisiones y efectos</h3><table><tr><th>Decisión</th><th>Efecto</th></tr><tr><td>Precio</td><td>Menor precio favorece la demanda; un mayor precio aumenta el margen unitario.</td></tr><tr><td>Capacidad</td><td>Por cada 6 € invertidos se añade una unidad de capacidad anual.</td></tr><tr><td>I+D</td><td>Mejora calidad, tecnología y parcialmente el coste variable.</td></tr><tr><td>Inversión ambiental</td><td>Mejora el indicador ambiental y reduce emisiones de fabricación del escenario.</td></tr><tr><td>Marketing</td><td>Aumenta el atractivo comercial y potencialmente las ventas.</td></tr><tr><td>Materia recuperada</td><td>Reduce emisiones estimadas, pero puede incrementar tratamiento y control de calidad.</td></tr></table><h3>Motor económico</h3><p>Demanda distribuida mediante atractivo comercial (precio, calidad, marketing y sostenibilidad). Las ventas quedan limitadas por capacidad y producción elegida. Costes: coste variable por unidad vendida más 28.000 € fijos por ronda. Resultado operativo = ingresos − costes. Tesorería final = tesorería inicial − inversiones + resultado operativo. No hay financiación, impuestos, amortización ni inventario.</p><h3>Puntuación</h3><p>Rentabilidad 25 % · Cuota 15 % · Circularidad 25 % · Calidad 15 % · Tesorería 10 % · Adaptación financiera 10 %. Todos los indicadores se normalizan a escalas didácticas. La clasificación se actualiza en cada ronda, no representa una valoración real.</p><h3>Limitaciones</h3><p>Las emisiones son estimaciones didácticas en kg CO₂e por unidad vendida, no un análisis de ciclo de vida. No se modelan normas técnicas, seguridad del producto, demanda real ni competencia externa. Los equipos deben justificar técnicamente los materiales y prestaciones en su cuaderno de trabajo.</p><h3>Uso en clase</h3><p>1. El profesor crea la sesión (ya inicializada). 2. Cada equipo accede con código. 3. Envía decisiones. 4. Cuando hay cuatro entregas, el profesor ejecuta la ronda. 5. Se examinan los resultados y se abre la siguiente. 6. Al acabar, exporta el CSV.</p></div>`}
function csvExport(){let rows=[['Ronda','Evento','Empresa','Ventas','Cuota %','Resultado €','Tesorería €','Circularidad','Calidad','Emisiones kg CO2e','Puntuación']];for(let rr of db.results)for(let r of rr.rows)rows.push([rr.round,rr.event,r.name,r.sales,r.share.toFixed(2),r.operating.toFixed(2),r.cash.toFixed(2),r.circular.toFixed(2),r.quality.toFixed(2),r.emissions.toFixed(2),r.score.toFixed(1)]);let blob=new Blob(['\ufeff'+rows.map(r=>r.join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='circular_business_uja_resultados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.role===role));$('headstatus').textContent=`Ronda ${db.round} de 4`; $('view').innerHTML=role==='prof'?prof():role==='alumno'?student():rules();if(role==='prof'){if($('event'))$('event').onchange=e=>{db.event=e.target.value;save();render()};if($('execute'))$('execute').onclick=execute;if($('next'))$('next').onclick=nextRound;$('export').onclick=csvExport;$('reset').onclick=()=>{if(confirm('¿Reiniciar toda la simulación? Se perderán las decisiones y resultados guardados.')){db=defaults();auth=false;save();render()}}}if(role==='alumno'){if($('login'))$('login').onclick=()=>{let t=db.teams.find(t=>t.code.toLowerCase()===$('teamcode').value.trim().toLowerCase());if(!t)return alert('Código no válido');selected=t.id;auth=true;render()};if($('logout'))$('logout').onclick=()=>{auth=false;render()};if($('decisions')){$('decisions').oninput=()=>{let d=Object.fromEntries(fields.map(([k])=>[k,Number($('f_'+k).value)]));let t=db.teams[selected-1];let amount=investment(d);$('investPreview').innerHTML=`Inversión total: <b>${euro(amount)}</b>. Disponible máximo: ${euro(Math.min(150000,Math.max(0,t.cash-15000)))}.`};$('decisions').oninput();$('decisions').onsubmit=e=>{e.preventDefault();let t=db.teams[selected-1];let d=Object.fromEntries(fields.map(([k])=>[k,Number($('f_'+k).value)]));if(!valid(d,t))return alert('Revisa los rangos, el presupuesto de 150.000 € y la reserva mínima de tesorería.');t.decision=d;t.submitted=true;save();render()}}}}
document.addEventListener('click',e=>{const b=e.target.closest('.copy-script');if(b){const index=Number(b.dataset.round)-1;if(navigator.clipboard&&chapterData[index])navigator.clipboard.writeText(chapterData[index].video).then(()=>alert('Guion copiado')).catch(()=>alert('No se pudo copiar. Selecciona el texto manualmente.'));}});document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{role=b.dataset.role;render()}));render();
</script></body></html>
